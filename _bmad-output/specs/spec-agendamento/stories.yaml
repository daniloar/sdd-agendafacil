- id: "1"
  title: Schema, slot and appointment state machines, Clock port
  description: >-
    Forward-only migrations for doctors, slots, appointments, soft_locks,
    waitlist_entry, waitlist_vip_counter, offers, idempotency_keys, slot_events,
    audit_records, cancellation_penalty; the partial unique indexes
    slot_id WHERE appointment.status='confirmada' and offers(slot_id) WHERE
    status='pendente'; the Slot.transition and Appointment.transition domain
    methods with their CAS SQL; an injectable Clock port. Covers SPEC.md
    Constraints and AD-1/AD-7/AD-10; underpins every capability.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
    Echo v5, PostgreSQL 18, Redis 8. Read ARCHITECTURE-SPINE.md AD-1..AD-11 and
    the prd.md FR consequences before coding.
- id: "2"
  title: Idempotency envelope and HTTP middleware
  description: >-
    Implement CAP-10: require an Idempotency-Key (UUID) on every mutating route
    (absent -> 400); insert the key row ON CONFLICT DO NOTHING in the same
    transaction as the domain mutation; replay same key+fingerprint -> stored
    response; same key + different body -> 422; concurrent same key -> one
    executes, the other waits for the original response or gets 409 "em
    processamento"; 24h fixed TTL with a sweep.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
    Echo v5, PostgreSQL 18, Redis 8. Read ARCHITECTURE-SPINE.md AD-1..AD-11 and
    the prd.md FR consequences before coding.
- id: "3"
  title: Transactional outbox, relay, and Redis stream
  description: >-
    Implement CAP-11: every transition writes a past-tense event to slot_events
    in the mutation's transaction; a relay binary reads the outbox and publishes
    to a Redis stream; provide the idempotent, reprocess-safe internal consumer
    scaffold that stories 9, 12, 13 and 14 plug into.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
