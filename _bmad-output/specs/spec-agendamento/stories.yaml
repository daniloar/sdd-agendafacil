- id: "11"
  title: Ordenação de fila com anti-starvation por quota e teto
  description: >-
    Implemente a CAP-8: uma função de domínio pura e determinística — classe
    (VIP antes de comum) e depois ordem de entrada; quota = um contador de
    concessões-VIP-consecutivas por médico+data, ANTI_STARVATION_QUOTA padrão 3,
    zerando em qualquer concessão a um comum; teto = ANTI_STARVATION_CEILING
    padrão 24h, um comum que o ultrapassa recebe prioridade máxima. Teste que um
    comum além do teto supera um VIP recém-enfileirado e que um comum é atendido
    dentro de N+1 liberações no pior caso.
