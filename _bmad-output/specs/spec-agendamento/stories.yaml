- id: "4"
  title: Soft-lock expiry — lazy and proactive
  description: >-
    Implement CAP-4: any write-path use case that reads status='held' AND
    held_until < now() performs the held->free CAS through Slot.transition before
    proceeding; the System worker does the same proactively off the Redis TTL; a
    read-only path that cannot open a write transaction treats the slot as free
    for display only.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
    Echo v5, PostgreSQL 18, Redis 8. Read ARCHITECTURE-SPINE.md AD-1..AD-9 before
    coding.
- id: "5"
  title: Transactional outbox, relay, and Redis stream
  description: >-
    Implement CAP-11: every slot transition writes a past-tense event to
    slot_events in the mutation's transaction; a relay binary reads the outbox
    and publishes to a Redis stream; provide the idempotent, reprocess-safe
    internal consumer scaffold that stories 6, 9, and 10 plug into.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
