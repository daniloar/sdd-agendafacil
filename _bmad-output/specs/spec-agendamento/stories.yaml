- id: "10"
  title: Waitlist join (two scopes), authority/projection, reconciler, leave
  description: >-
    Implement CAP-6, CAP-12 and CAP-17: write waitlist_entry (Postgres
    authority) with scope slot:<id> or doctor:<id>:<yyyy-mm-dd>, enqueued_at and
    class, mirrored best-effort to the matching Redis sorted set; a patient
    appears at most once per queue; joining a slot's waitlist where the patient
    already has a confirmada appointment -> 409; leave is idempotent and marks a
    pendente offer recusada then triggers advance; a reconciler reprojects both
    sorted sets and the waitlist_vip_counter from Postgres on boot and
    periodically, with a domain-function fallback on miss.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
