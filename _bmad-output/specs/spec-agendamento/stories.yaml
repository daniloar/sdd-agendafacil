    the prd.md FR consequences before coding.
- id: "13"
  title: D-1 reminder, presence confirmation, em_risco marking
  description: >-
    Implement CAP-9, CAP-18, CAP-19 plus the NotificationGateway port with a
    reference log adapter: the System sends one D-1 reminder per confirmada
    appointment whose slot starts the next day (deterministic key
    reminder:<appointment_id>:D-1; ~18:00 clinic timezone -> UTC; no resend; none
    for cancelada/concluida/no_show); register presence confirmation
    (idempotent; after slot start -> 409); at T-2h with no presence confirmation
    the System sets the slot em_risco (appointment stays confirmada; presence or
    Check-in returns it to confirmado; idempotent; no pre-oferta in MVP).
  invoke_dev_with: >-
