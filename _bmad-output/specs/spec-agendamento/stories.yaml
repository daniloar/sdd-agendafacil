- id: "7"
  title: Soft Lock e confirmação
  description: >-
    Implemente a CAP-2 e a CAP-3: CAS de livre->reservado (exatamente um
    vencedor sob K até 50; não-livre -> 409; no máximo 1 Soft Lock ativo por
    paciente por médico+data -> 409) com um marcador Redis EX 900; CAS de
    reservado->confirmado protegido por held_by e held_until, com o índice único
    parcial como rede de segurança; uma repetição com chave diferente quando a
    consulta já existe a retorna, não um erro. Inclui o teste de contenção de
    reserva dupla deliberada.
  invoke_dev_with: >-
    Escreva os testes primeiro. Toda mutação de estado é CAS com verificação de
