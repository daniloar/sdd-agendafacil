- id: "8"
  title: Soft-lock expiry — lazy and proactive
  description: >-
    Implement CAP-4: any write-path use case that reads status='reservado' AND
    held_until < now() performs the reservado->livre CAS through the transition
    method (outbox event + audit record in the same transaction) before
    proceeding; the System worker does the same proactively off the Redis TTL;
    a read-only path that cannot open a write transaction treats the slot as
    free for display only; delay to effective release <= 30 s.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
