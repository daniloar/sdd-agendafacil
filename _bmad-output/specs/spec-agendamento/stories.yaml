- id: "10"
  title: Entrada na Fila de Espera (dois escopos), autoridade/projeção, reconciliador, saída
  description: >-
    Implemente a CAP-6, a CAP-12 e a CAP-17: escrever waitlist_entry (autoridade
    no Postgres) com scope slot:<id> ou doctor:<id>:<yyyy-mm-dd>, enqueued_at e
    class, espelhado em melhor esforço para o Redis sorted set correspondente;
    um paciente aparece no máximo uma vez por fila; entrar na Fila de Espera de
    um slot onde o paciente já tem uma consulta confirmada -> 409; a saída é
    idempotente e marca uma offer pendente como recusada e então dispara o
    avanço; um reconciliador reprojeta ambos os sorted sets e o
    waitlist_vip_counter a partir do Postgres na inicialização e periodicamente,
    com fallback para a função de domínio em caso de falha de leitura.
