- id: "15"
  title: Invariant-metrics endpoint and system-job observability
  description: >-
    Implement CAP-24 and CAP-25: an endpoint exposing zero slots with two
    confirmada appointments, zero duplicate pendente offers per slot, zero
    duplicate penalties per appointment, and the common-patient waitlist
    wait-time distribution (all violation counters zero after the contention
    run); each System job runs on a configurable interval, converges on re-run
    (no orphan-locked slot, no ownerless pending offer, no partial penalty), and
    emits items processed / transitions made / duration.
  invoke_dev_with: >-
