- id: "9"
  title: Cancel with penalty and slot reopen
  description: >-
    Implement CAP-5: confirmado->cancelado CAS once; when start - now() < 2h a
    cancellation_penalty row with amount = 50% of the slot's Valor de Referencia
    (fixed at slot creation) and its currency is written in the same
    transaction; the slot then goes livre and emits slot.cancelled; >= 2h ahead
    writes no penalty; cancelling a concluida/no_show appointment -> 409; at most
    one penalty per appointment under concurrent/repeated cancels. No collection.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
