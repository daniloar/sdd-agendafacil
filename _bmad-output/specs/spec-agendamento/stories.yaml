- id: "4"
  title: Immutable audit trail wired into every transition
  description: >-
    Implement CAP-23: an append-only audit_record (entity, entity_id,
    prev_state, new_state, actor in {patient_id|doctor_id|system}, cause, ts UTC)
    written in the same transaction as every Slot, Appointment, SoftLock, Offer
    and Penalty transition; never updated or deleted; entity history is
    reconstructable; state-transition count equals audit-record count.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
