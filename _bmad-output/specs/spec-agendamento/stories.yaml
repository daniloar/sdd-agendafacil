- id: "5"
  title: Schedule publication — register doctor, publish slots, block/unblock
  description: >-
    Implement CAP-13, CAP-14, CAP-15: register a Doctor (name, specialty,
    default Valor de Referencia; missing -> 422; idempotent); publish N slots in
    one request (all livre, inheriting the Doctor's Valor de Referencia;
    overlapping intervals -> 422 rejecting the whole batch; end <= start -> 422;
    idempotent); block/unblock a livre slot (non-livre -> 409; a bloqueado slot
    is absent from discovery and cannot receive a soft lock).
