- id: "9"
  title: Cancelamento com Penalidade e reabertura do slot
  description: >-
    Implemente a CAP-5: CAS confirmado->cancelado uma vez; quando start - now()
    < 2h, uma linha cancellation_penalty com amount = 50% do Valor de Referência
    do slot (fixado na criação do slot) e sua moeda é escrita na mesma
    transação; o slot então vai para livre e emite slot.cancelled; com >= 2h de
    antecedência não escreve Penalidade; cancelar uma consulta concluida/no_show
    -> 409; no máximo uma Penalidade por consulta sob cancelamentos
    concorrentes/repetidos. Sem coleta.
  invoke_dev_with: >-
    Escreva os testes primeiro. Toda mutação de estado é CAS com verificação de
