    coding.
- id: "10"
  title: D-1 reminder with two-stage risk and release
  description: >-
    Implement CAP-9: the System worker sends the reminder about 24h before start
    with the deterministic key reminder:<appointment_id>:D-1; non-confirmation by
    the D-1 cutoff sets appointment.risk = high with the slot still confirmed;
    still-unconfirmed at the T-2h cutoff releases the slot toward free (driving
    story 9's advance) with no patient penalty.
  invoke_dev_with: >-
