- id: "14"
  title: No-show lifecycle — auto no-show, check-in, doctor override
  description: >-
    Implement CAP-20, CAP-21, CAP-22: the System auto-marks no_show any
    confirmada appointment whose slot started more than 15 min ago with no
    Check-in (idempotent; a confirmed no-show frees the slot and triggers
    story-12 advance; audit record with cause); register Check-in from 30 min
    before to 15 min after slot start (blocks auto no-show; idempotent; outside
    the window -> 409); the owning Doctor undoes a no-show -> confirmada (409
    with the conflict stated if the slot was re-confirmed for a third party;
    audit with doctor_id; idempotent).
