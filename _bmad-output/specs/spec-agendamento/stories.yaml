- id: "8"
  title: Expiração de Soft Lock — preguiçosa e proativa
  description: >-
    Implemente a CAP-4: qualquer caso de uso de caminho de escrita que leia
    status='reservado' AND held_until < now() executa o CAS reservado->livre
    através do método de transição (evento de outbox + registro de auditoria na
    mesma transação) antes de prosseguir; o worker do Sistema faz o mesmo
    proativamente a partir do TTL do Redis; um caminho somente leitura que não
    consegue abrir uma transação de escrita trata o slot como livre apenas para
    exibição; atraso até a liberação efetiva <= 30 s.
  invoke_dev_with: >-
