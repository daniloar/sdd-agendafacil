- id: "15"
  title: Endpoint de métricas de invariantes e observabilidade dos jobs do Sistema
  description: >-
    Implemente a CAP-24 e a CAP-25: um endpoint que expõe zero slots com duas
    consultas confirmada, zero offers pendente duplicadas por slot, zero
    Penalidades duplicadas por consulta, e a distribuição de tempo de espera na
    Fila de Espera do Paciente comum (todos os contadores de violação em zero
    após a execução de contenção); cada job do Sistema executa em um intervalo
    configurável, converge na reexecução (nenhum slot com lock órfão, nenhuma
    Oferta pendente sem dono, nenhuma Penalidade parcial), e emite itens
    processados / transições feitas / duração.
