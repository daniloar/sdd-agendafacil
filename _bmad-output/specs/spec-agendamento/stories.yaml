- id: "1"
  title: Schema, máquinas de estado de slot e consulta, porta Clock
  description: >-
    Migrations forward-only para doctors, slots, appointments, soft_locks,
    waitlist_entry, waitlist_vip_counter, offers, idempotency_keys, slot_events,
    audit_records, cancellation_penalty; os índices únicos parciais
    slot_id WHERE appointment.status='confirmada' e offers(slot_id) WHERE
    status='pendente'; os métodos de domínio Slot.transition e
    Appointment.transition com seu SQL de CAS; uma porta Clock injetável. Cobre
    as Restrições do SPEC.md e AD-1/AD-7/AD-10; sustenta toda capacidade.
  invoke_dev_with: >-
    Escreva os testes primeiro. Toda mutação de estado é CAS com verificação de
    linhas afetadas — sem SELECT ... FOR UPDATE, sem advisory lock bloqueante.
    Caminhos críticos de concorrência precisam de um teste de contenção
    deliberada (testcontainers-go). Stack: Go 1.26, Echo v5, PostgreSQL 18,
    Redis 8. Leia ARCHITECTURE-SPINE.md AD-1..AD-11 e as consequências dos FR do
    prd.md antes de codar.
- id: "2"
  title: Envelope de idempotência e middleware HTTP
  description: >-
    Implemente a CAP-10: exigir uma Idempotency-Key (UUID) em toda rota mutante
    (ausente -> 400); inserir a linha da chave com ON CONFLICT DO NOTHING na
    mesma transação que a mutação de domínio; repetição com mesma
    chave+fingerprint -> resposta armazenada; mesma chave + corpo diferente ->
    422; mesma chave concorrente -> uma executa, a outra aguarda a resposta
    original ou recebe 409 "em processamento"; TTL fixo de 24h com uma
    varredura.
  invoke_dev_with: >-
    Escreva os testes primeiro. Toda mutação de estado é CAS com verificação de
    linhas afetadas — sem SELECT ... FOR UPDATE, sem advisory lock bloqueante.
    Caminhos críticos de concorrência precisam de um teste de contenção
    deliberada (testcontainers-go). Stack: Go 1.26, Echo v5, PostgreSQL 18,
    Redis 8. Leia ARCHITECTURE-SPINE.md AD-1..AD-11 e as consequências dos FR do
    prd.md antes de codar.
