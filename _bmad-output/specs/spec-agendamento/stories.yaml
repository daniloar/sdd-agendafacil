    the prd.md FR consequences before coding.
- id: "12"
  title: Waitlist advance, 30-minute offer, and accept
  description: >-
    Implement CAP-7 and CAP-16: on a slot becoming livre (cancel, expiry,
    no-show) select the next entry by the story-11 ordering over the merged
    slot-scope + doctor+date-scope candidates; set offer:<slot_id> EX 1800 and
    insert an offers row via INSERT ON CONFLICT DO NOTHING on the pendente
    partial unique index so at most one pending offer per slot exists and
    concurrent release+advance converge; payload names the slot_id; 30-minute
    clock from notification sent; on expiry/refusal advance or leave livre; a
    served patient leaves all queues for that doctor+date; accepting a pendente
    offer in-window -> confirmada appointment (idempotent; expired/refused/other
    patient -> 409; same uniqueness invariant as story 7).
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
