- id: "9"
  title: Waitlist advance and 30-minute offer
  description: >-
    Implement CAP-7: on a doctor-day slot being freed (cancel, expiry, or
    reopen event) select the next entry by ascending score, set
    offer:<doctor_id>:<yyyy-mm-dd> with EX 1800 and write a waitlist_offer row,
    put the concrete slot_id in the offer payload, start the 30-minute clock at
    notification sent, advance to the next entry on expiry, and route acceptance
    through the confirm path.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
