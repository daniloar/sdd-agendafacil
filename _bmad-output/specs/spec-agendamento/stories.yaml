    coding.
- id: "7"
  title: Waitlist join, authority, projection, and reconciler
  description: >-
    Implement CAP-6 and CAP-12: write the waitlist_entry row (Postgres
    authority) in the use-case transaction with doctor_id, UTC calendar date,
    enqueued_at, and is_vip, do a best-effort ZADD to
    waitlist:<doctor_id>:<yyyy-mm-dd>, and add the reconciler that reprojects the
    sorted set from the table on boot and periodically, with a SELECT ORDER BY
    score fallback on miss.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
