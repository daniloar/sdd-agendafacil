    coding.
- id: "8"
  title: Waitlist score and VIP anti-starvation
  description: >-
    Implement CAP-8: the pure domain score
    enqueued_at_ms - VIP_BOOST - age_promotion(waited), with VIP_BOOST (default
    24h) and AGE_PROMOTION_CEILING (default 48h) as 12-factor env vars, re-score
    as an idempotent ZADD, and a single queue with no separate VIP set. Test that
    a common entry past the ceiling outranks a freshly enqueued VIP.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
