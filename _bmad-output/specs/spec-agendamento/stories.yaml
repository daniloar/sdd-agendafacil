    Echo v5, PostgreSQL 18, Redis 8. Read ARCHITECTURE-SPINE.md AD-1..AD-9 before
    coding.
- id: "6"
  title: Cancel with penalty and slot reopen
  description: >-
    Implement CAP-5: the confirmed->cancelled CAS succeeds once; when
    start - now() < 2h a cancellation_penalty row with amount = 50% of the slot's
    consultation_price and its currency is written in the same transaction; the
    slot then transitions cancelled->free and emits slot.cancelled. No charge or
    collection.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
