- id: "12"
  title: Avanço da Fila de Espera, Oferta de 30 minutos e aceite
  description: >-
    Implemente a CAP-7 e a CAP-16: quando um slot passa a livre (cancelamento,
    expiração, no-show) selecionar a próxima entrada pela ordenação da história
    11 sobre os candidatos mesclados de escopo-de-slot + escopo-de-médico+data;
    definir offer:<slot_id> EX 1800 e inserir uma linha offers via INSERT ON
    CONFLICT DO NOTHING no índice único parcial de pendente para que exista no
    máximo uma Oferta pendente por slot e liberação+avanço concorrentes
    convirjam; o payload nomeia o slot_id; relógio de 30 minutos a partir do
    envio da notificação; na expiração/recusa avançar ou deixar livre; um
    paciente atendido sai de todas as filas daquele médico+data; aceitar uma
    offer pendente dentro da janela -> consulta confirmada (idempotente;
    expirada/recusada/outro paciente -> 409; mesmo invariante de unicidade da
    história 7).
  invoke_dev_with: >-
