    the prd.md FR consequences before coding.
- id: "11"
  title: Queue ordering with quota and ceiling anti-starvation
  description: >-
    Implement CAP-8: a pure, deterministic domain function — class (VIP before
    comum) then entry order; quota = a consecutive-VIP-grant counter per
    doctor+date, ANTI_STARVATION_QUOTA default 3, resetting on any grant to a
    comum; ceiling = ANTI_STARVATION_CEILING default 24h, a comum past it gets
    top priority. Test that a comum past the ceiling outranks a freshly
    enqueued VIP and that a comum is served within N+1 releases worst case.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
