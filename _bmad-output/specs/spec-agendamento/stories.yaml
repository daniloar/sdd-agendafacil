- id: "7"
  title: Soft-lock and confirm
  description: >-
    Implement CAP-2 and CAP-3: free->held CAS (exactly one winner under K up to
    50; non-livre -> 409; at most 1 active soft lock per patient per doctor+date
    -> 409) with a Redis EX 900 marker; held->confirmed CAS guarded by held_by
    and held_until, with the partial unique index as backstop; a different-key
    repeat when the appointment already exists returns it, not an error.
    Includes the deliberate double-booking contention test.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
