- id: "1"
  title: Schema and slot state-machine foundation
  description: >-
    Create forward-only migrations for slots, appointments, waitlist_entry,
    waitlist_offer, idempotency_keys, slot_events, and cancellation_penalty,
    including the partial unique index on slot_id WHERE status='confirmed', and
    build the single Slot.transition(to, guard) domain method with its CAS SQL
    and an injectable Clock port (SPEC.md Constraints; underpins every CAP).
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
    Echo v5, PostgreSQL 18, Redis 8. Read ARCHITECTURE-SPINE.md AD-1..AD-9 before
    coding.
- id: "2"
  title: Idempotency envelope and HTTP middleware
  description: >-
    Implement CAP-10: require an Idempotency-Key (UUID) header on every mutating
    POST/PUT (400 if absent), insert the key row ON CONFLICT DO NOTHING in the
    same transaction as the domain mutation, replay the stored response on a
    matching key+fingerprint, return 409 on fingerprint mismatch, and sweep keys
    past their 24h TTL.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
    Echo v5, PostgreSQL 18, Redis 8. Read ARCHITECTURE-SPINE.md AD-1..AD-9 before
    coding.
- id: "3"
  title: Discover, soft-lock, and confirm
  description: >-
    Implement CAP-1, CAP-2, and CAP-3: read-only agenda listing with lazy-expiry
    display semantics, the free->held CAS with a Redis EX 900 hold marker, and
    the held->confirmed CAS guarded by held_by and held_until with the partial
    unique index as backstop. Includes the deliberate double-booking contention
    test.
  invoke_dev_with: >-
    Write tests first. Every state mutation is CAS with a rows-affected check —
    no SELECT ... FOR UPDATE, no blocking advisory lock. Concurrency-critical
    paths need a deliberate-contention test (testcontainers-go). Stack: Go 1.26,
    Echo v5, PostgreSQL 18, Redis 8. Read ARCHITECTURE-SPINE.md AD-1..AD-9 before
